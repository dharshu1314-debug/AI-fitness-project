<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy AI - Fitness Plan Generator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dfffe2, #e8f5ff);
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #16803c;
            font-size: 40px;
        }

        header p {
            color: #555;
            margin-top: 8px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .card h2 {
            color: #16803c;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #16803c;
        }

        .button-box {
            text-align: center;
            margin-top: 25px;
        }

        button {
            background: #16803c;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #0f642e;
        }

        #loading {
            display: none;
            text-align: center;
            color: #16803c;
            font-weight: bold;
            margin: 20px;
        }

        #resultCard {
            display: none;
        }

        #result {
            line-height: 1.8;
            color: #333;
        }

        .plan-section {
            background: #f3fff5;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            border-left: 5px solid #16803c;
        }

        .plan-section h3 {
            color: #16803c;
            margin-bottom: 7px;
        }

        .footer {
            text-align: center;
            color: #777;
            margin-top: 20px;
        }

        @media(max-width: 650px) {
            body {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>💪 FitBuddy AI</h1>
        <p>Personal Fitness & Wellness Plan Generator</p>
    </header>


    <div class="card">

        <h2>📝 Enter Your Details</h2>

        <div class="form-grid">

            <div>
                <label>Age</label>
                <input type="number" id="age" placeholder="Enter your age">
            </div>

            <div>
                <label>Activity Level</label>

                <select id="activity">
                    <option value="">Select Activity Level</option>
                    <option value="beginner">Beginner</option>
                    <option value="light">Light Activity</option>
                    <option value="moderate">Moderate Activity</option>
                    <option value="active">Active</option>
                </select>
            </div>


            <div>
                <label>Fitness Goal</label>

                <select id="goal">
                    <option value="">Select Fitness Goal</option>
                    <option value="general">General Fitness</option>
                    <option value="strength">Build Strength</option>
                    <option value="endurance">Improve Endurance</option>
                    <option value="wellness">Healthy Lifestyle</option>
                </select>
            </div>


            <div>
                <label>Preferred Exercise</label>

                <select id="exercise">
                    <option value="">Select Exercise Type</option>
                    <option value="home">Home Exercise</option>
                    <option value="walking">Walking</option>
                    <option value="yoga">Yoga & Stretching</option>
                    <option value="mixed">Mixed Activities</option>
                </select>
            </div>

        </div>


        <div class="button-box">

            <button onclick="generatePlan()">
                ✨ Generate Fitness Plan
            </button>

        </div>

    </div>


    <div id="loading">
        🤖 FitBuddy AI is creating your plan...
    </div>


    <div class="card" id="resultCard">

        <h2>🏋️ Your FitBuddy Plan</h2>

        <div id="result"></div>

    </div>


    <div class="footer">
        <p>Powered by FitBuddy AI • Healthy Lifestyle Assistant</p>
    </div>

</div>


<script>

function generatePlan() {

    const age = document.getElementById("age").value;
    const activity = document.getElementById("activity").value;
    const goal = document.getElementById("goal").value;
    const exercise = document.getElementById("exercise").value;

    if (!age || !activity || !goal || !exercise) {

        alert("Please fill all the fields.");

        return;
    }


    const loading = document.getElementById("loading");
    const resultCard = document.getElementById("resultCard");
    const result = document.getElementById("result");


    loading.style.display = "block";
    resultCard.style.display = "none";


    setTimeout(function() {

        let goalText = "";
        let workout = "";
        let exerciseText = "";


        // FITNESS GOAL

        if (goal === "general") {

            goalText =
            "Improve overall fitness, movement, energy and healthy daily habits.";

        }

        else if (goal === "strength") {

            goalText =
            "Build strength gradually using beginner-friendly bodyweight exercises.";

        }

        else if (goal === "endurance") {

            goalText =
            "Gradually improve stamina through comfortable, consistent activity.";

        }

        else {

            goalText =
            "Build healthy daily habits including movement, sleep, hydration and balanced meals.";

        }


        // ACTIVITY LEVEL

        if (activity === "beginner") {

            workout =
            "3 days per week. Start with gentle movement, easy bodyweight exercises and rest days.";

        }

        else if (activity === "light") {

            workout =
            "3–4 days per week. Combine walking or light cardio with simple strength exercises.";

        }

        else if (activity === "moderate") {

            workout =
            "4 days per week. Combine moderate cardio, strength exercises and mobility work.";

        }

        else {

            workout =
            "4–5 days per week with varied activities and appropriate recovery days.";

        }


        // EXERCISE TYPE

        if (exercise === "home") {

            exerciseText =
            "Try gentle squats, wall push-ups, glute bridges, bird-dog exercises and stretching.";

        }

        else if (exercise === "walking") {

            exerciseText =
            "Begin with comfortable-paced walking and gradually increase duration as it feels comfortable.";

        }

        else if (exercise === "yoga") {

            exerciseText =
            "Use gentle yoga, mobility exercises and relaxed stretching. Avoid forcing any movement.";

        }

        else {

            exerciseText =
            "Combine walking, simple bodyweight exercises, mobility work and enjoyable recreational activity.";

        }


        result.innerHTML = `

            <div class="plan-section">

                <h3>1. 🎯 Fitness Goal</h3>

                <p>${goalText}</p>

            </div>


            <div class="plan-section">

                <h3>2. 🏃 Weekly Workout Plan</h3>

                <p>${workout}</p>

                <p>${exerciseText}</p>

            </div>


            <div class="plan-section">

                <h3>3. 🔥 Warm-up</h3>

                <p>
                Start each session with 5–10 minutes of gentle movement,
                such as walking and comfortable mobility exercises.
                </p>

            </div>


            <div class="plan-section">

                <h3>4. 🧘 Cool-down</h3>

                <p>
                Finish with slow movement and gentle stretching.
                Do not force a stretch or exercise through pain.
                </p>

            </div>


            <div class="plan-section">

                <h3>5. 🥗 Healthy Eating Tips</h3>

                <p>
                Eat a variety of vegetables, fruits, whole grains,
                protein foods and other nutritious foods.
                Regular balanced meals can support energy and wellbeing.
                </p>

            </div>


            <div class="plan-section">

                <h3>6. 💧 Hydration</h3>

                <p>
                Drink water regularly throughout the day,
                especially when you are active or it is hot.
                </p>

            </div>


            <div class="plan-section">

                <h3>7. 😴 Rest & Recovery</h3>

                <p>
                Include rest days and aim for consistent, good-quality sleep.
                Recovery is an important part of fitness.
                </p>

            </div>


            <div class="plan-section">

                <h3>8. ⚠️ Safety Tips</h3>

                <p>
                Start gradually and choose activities appropriate for your
                experience level. Stop if you feel pain, dizziness or feel unwell.
                If you have a health condition or ongoing pain, ask a qualified
                healthcare professional for advice.
                </p>

            </div>

        `;


        loading.style.display = "none";

        resultCard.style.display = "block";


    }, 1000);

}

</script>

</body>
</html>
